<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Files | Open & Download</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#65728a;--line:#e4eaf2;--accent:#4f46e5;--accent2:#4338ca}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 48%,#ecfeff 100%);color:var(--ink);min-height:100vh}
header{padding:48px 20px 32px;text-align:center}header .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(28px,4vw,42px);margin:12px 0 10px;letter-spacing:-.04em}header p{color:var(--muted);margin:0;font-size:16px}
main{width:min(1000px,calc(100% - 32px));margin:0 auto 60px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 20px;flex-wrap:wrap}.count{color:var(--muted);font-size:14px}.search{width:min(320px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;font-size:14px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f46e51a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.file-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px #17203308;display:flex;flex-direction:column;min-height:215px;transition:transform .18s,box-shadow .18s}.file-card:hover{transform:translateY(-3px);box-shadow:0 18px 36px #17203312}.file-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.file-icon{width:50px;height:56px;border-radius:12px;background:#eef2ff;color:var(--accent);display:grid;place-items:center;flex:none}.file-icon svg{width:27px;height:27px}.file-name{font-size:16px;font-weight:750;overflow-wrap:anywhere}.file-type{font-size:12px;color:var(--muted);margin-top:5px}.file-note{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.actions{display:flex;gap:10px;margin-top:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:14px;font-weight:700;padding:11px 15px;border-radius:10px;flex:1;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:hover{filter:brightness(.97)}.empty{display:none;text-align:center;color:var(--muted);padding:45px 10px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 30px}
@media(max-width:480px){header{padding-top:36px}.file-card{padding:17px}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">File Library</div>
  <h1>Your files, in one place</h1>
  <p>Open a file to view it, or download a copy to your device.</p>
</header>

<main>
  <div class="toolbar">
    <div class="count" id="count">12 files available</div>
    <input class="search" id="search" type="search" placeholder="Search files..." aria-label="Search files">
  </div>
  <section class="grid" id="fileGrid" aria-label="Files"></section>
  <div class="empty" id="empty">No matching files found.</div>
</main>
<div class="footer">Your updated program files · Open or download any file</div>
<script>
const files = ["program 1(2).txt", "program 2(2).txt", "program 3(2).txt", "program 4(4).txt", "program 5(4).txt", "program 6(2).txt", "program 7(2).txt", "program 8(2).txt", "program 9(2).txt", "program 10(2).txt", "program 11(2).txt", "program 12(3).txt"];
const grid = document.getElementById('fileGrid');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
function render() {
  const query = search.value.trim().toLowerCase();
  const visible = files.filter(name => name.toLowerCase().includes(query));
  count.textContent = `${visible.length} of ${files.length} files available`;
  empty.style.display = visible.length ? 'none' : 'block';
  grid.innerHTML = visible.map(name => {
    const url = 'files/' + encodeURIComponent(name).replaceAll('%2F','/');
    return `<article class="file-card">
      <div class="file-top">
        <div class="file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2.8h8l4 4V21H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></div>
        <div><div class="file-name">${name}</div><div class="file-type">TEXT DOCUMENT · TXT</div></div>
      </div>
      <p class="file-note">Open this program file in your browser or save it to your device.</p>
      <div class="actions"><a class="btn primary" href="${url}" target="_blank" rel="noopener">↗ Open</a><a class="btn" href="${url}" download>↓ Download</a></div>
    </article>`;
  }).join('');
}
search.addEventListener('input', render);
render();
</script>
</body>
</html>
